services:
  pruebas:
    build:
      context: .
      target: dev
      # Parsers y lector TypeScript de HEAD compilados en la imagen (motor-real-servidor, decisiones 4 y 10).
      additional_contexts:
        repo_git: ../.git
    # --frozen: usa el uv.lock montado tal cual (nunca lo reescribe).
    # Solo lectura (revisión de privacidad): caches desactivadas y /tmp en memoria.
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      UV_CACHE_DIR: /tmp/uv
      UV_NO_SYNC: "1"
    command: >-
      sh -c "uv run --frozen ruff check --no-cache . && uv run --frozen ruff format --no-cache --check .
      && uv run --frozen pytest -q -p no:cacheprovider"
    volumes:
      - ./app:/srv/app:ro
      - ./tests:/srv/tests:ro
      - ./openapi:/srv/openapi:ro
      - ./interprete:/srv/interprete:ro
      - ./lector/leer.mjs:/srv/lector/leer.mjs:ro
      # MS-01 a MS-15: fixtures sintéticos de los parsers (personas ficticias, números 9999...).
      - ../evals/fixtures/sinteticos:/srv/fixtures_sinteticos:ro
      - ./pyproject.toml:/srv/pyproject.toml:ro
      - ./uv.lock:/srv/uv.lock:ro
      # AV-30: la prueba de configuración lee `read_only` de este archivo.
      - ./compose.yaml:/srv/compose.yaml:ro
      # AV-19: los IDs de warnings se comprueban contra el registro de hipótesis del formato.
      - ../docs/decisiones/hipotesis-formato.md:/srv/docs/decisiones/hipotesis-formato.md:ro

  api:
    build:
      context: .
      target: produccion
      # Parsers y lector TypeScript de HEAD compilados en la imagen (motor-real-servidor, decisiones 4 y 10).
      additional_contexts:
        repo_git: ../.git
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      # MS-19: motor real con el lector Node de packages/capture.
      LECTOR_LIVE: node

  # Misma imagen que `api`, con claves sintéticas, para Schemathesis, ZAP y Locust (decisión 16).
  # Ninguna clave ni secreto de este servicio es real (skill fixture-sintetico).
  api-pruebas:
    build:
      context: .
      target: produccion
      # Parsers y lector TypeScript de HEAD compilados en la imagen (motor-real-servidor, decisiones 4 y 10).
      additional_contexts:
        repo_git: ../.git
    command:
      - /srv/.venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-access-log
    ports: ["8000:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      # sha256 de KT, KT2 y KL de la spec (sk_test_0..., sk_test_1..., sk_live_2...). KT es el aplicativo A y
      # KT2 el B (sdk-integracion, SDK-16); KL conserva la forma anterior, sin orígenes ni retornos.
      CLAVES_API_JSON: >-
        [{"sha256": "9e7856735d2236cd8512842bd06a1515fa62426519a64c6705bffeb9d010337c",
        "secreto_webhook": "whsec_sintetico_0123456789abcdef",
        "origenes": ["https://app-a.example"],
        "retornos": ["https://app-a.example/volver", "com.ejemplo.appa://lector/retorno"]},
        {"sha256": "ae8bec1baed6cd650cfce35842f4122a7117e789544f6e1966170a4526d28f8a",
        "secreto_webhook": "whsec_sintetico_fedcba9876543210",
        "origenes": ["https://app-b.example"],
        "retornos": ["https://app-b.example/fin"]},
        {"sha256": "5903d094b21970fafc45862ba3da53ead886f9997b7e9304f9c72f166d944990",
        "secreto_webhook": "whsec_sintetico_live_0000000000"}]
      SECRETO_SUBIDA: secreto_subida_sintetico_solo_pruebas_0000000000
      # Dominio de ejemplo de la spec (SDK-13, SDK-19): `hosted_url` y `upload.url` lo llevan; los clientes de
      # prueba usan solo la ruta y la query de `upload.url`.
      URL_PUBLICA: https://api.lector-cedula.example
      LIMITE_PETICIONES_POR_MINUTO: "100000"
      LECTOR_LIVE: node
    healthcheck:
      test:
        - CMD
        - /srv/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
