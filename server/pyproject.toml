[project]
name = "lector-cedula-server"
version = "0.0.0"
description = "Servidor de respaldo: re-decodificación PDF417, OCR y API. Procesa solo en memoria."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  # Licencias verificadas con `node tools/licencia-check.mjs --pip` (principio IV).
  "python-multipart>=0.0.20", # Apache-2.0: parser multipart en streaming, sin disco (decisión 3)
  "pyyaml>=6.0.2",            # MIT: carga del contrato OpenAPI (decisión 1)
  "httpx>=0.27",              # BSD-3-Clause: transporte de webhooks (decisión 6)
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "hypothesis>=6.112", # MPL-2.0: pruebas de propiedades
  "jsonschema>=4.23",  # MIT: valida respuestas contra los esquemas del contrato
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
# T20: prohíbe print (principio III, evita filtrar datos personales a la salida)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
