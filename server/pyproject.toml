[project]
name = "lector-cedula-server"
version = "0.0.0"
description = "Servidor de respaldo: re-decodificación PDF417, OCR y API. Procesa solo en memoria."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
# T20: prohíbe print (principio III, evita filtrar datos personales a la salida)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
