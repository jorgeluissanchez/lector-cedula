schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

rules:
  design:
    - Incluir una sección "## Pruebas" con una tabla por requisito (tipo de prueba, herramienta, comando, umbral) según la skill .claude/skills/estrategia-pruebas/SKILL.md.
  tasks:
    - Cada tarea nombra los tipos de prueba que entrega (unitaria, propiedad, mutación, E2E, contrato, accesibilidad, metamórfica, eval, seguridad) y el comando exacto que la verifica.
    - Todas las tareas siguen TDD; la prueba se ve fallar antes de implementar.
  specs:
    - Escenarios WHEN/THEN con valores literales y sintéticos; ninguno con datos de personas reales.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
