# TEMPORAL (rama ci/mot-07): repite las pruebas de MOT-07 "Copias a cero" 20 veces bajo carga de CPU y corre la
# puerta completa. Se quita antes del PR.
name: mot07-temporal

on:
  push:
    branches: [ci/mot-07]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repetir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de pruebas
        uses: ./.github/actions/preparar-node
      - name: MOT-07 Copias a cero x20 con carga (4 procesos de CPU y 2 corridas en paralelo)
        shell: bash
        run: |
          carga=()
          for i in 1 2 3 4; do (while :; do :; done) & carga+=($!); done
          correr() {
            npx vitest run packages/motor/test/motor.test.ts -t "MOT-07 Copias a cero" --maxWorkers=1 > "salida-$1.txt" 2>&1
            echo $? > "codigo-$1.txt"
          }
          for ronda in $(seq 1 10); do
            correr "$ronda-a" & pa=$!
            correr "$ronda-b" & pb=$!
            wait $pa $pb || true
          done
          kill "${carga[@]}" 2>/dev/null || true
          fallos=0
          for f in codigo-*.txt; do
            n=${f#codigo-}; n=${n%.txt}
            c=$(cat "$f")
            echo "corrida $n: codigo $c $(grep -hoE 'Tests +[0-9]+ (passed|failed)[^)]*' "salida-$n.txt" | tr -d '\033' | head -1)"
            if [ "$c" != "0" ]; then fallos=$((fallos+1)); grep -hE "FAIL|Error|×" "salida-$n.txt" | head -10; fi
          done
          total=$(ls codigo-*.txt | wc -l)
          echo "fallos: $fallos de $total"
          test "$fallos" = "0" && test "$total" = "20"

  puerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de pruebas
        uses: ./.github/actions/preparar-node
      - name: Puerta completa
        run: npm run check
