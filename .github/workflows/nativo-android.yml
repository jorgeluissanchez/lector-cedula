# SDK nativo Android (sdk-nativo, tarea 0.4; design.md, decisión 8). Sin secretos y sin publicar nada: solo compila,
# prueba y guarda informes como artefactos del propio run. Actions fijadas por SHA (lección de CVE-2026-33634).
# Requiere confirmación humana: habilitar Actions en el repositorio.
name: nativo-android

on:
  push:
    branches: [main, "nativo/**"]
    paths:
      - "native/**"
      - "packages/nucleo-js/**"
      - "docker/android-sdk/**"
      - "tools/nativo/**"
      - "models/manifest.json"
      - ".github/workflows/nativo-android.yml"
  pull_request:
    paths:
      - "native/**"
      - "packages/nucleo-js/**"
      - "docker/android-sdk/**"
      - "tools/nativo/**"
      - "models/manifest.json"
      - ".github/workflows/nativo-android.yml"
  workflow_dispatch:
    inputs:
      pit:
        description: "KM de calidad y presencia (tarea 1.3): PIT repartido en fragmentos paralelos"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nativo-android-${{ github.ref }}-${{ inputs.pit && 'pit' || 'kj' }}
  cancel-in-progress: true

jobs:
  # KJ: pruebas JVM en la misma imagen Docker que se usa en local.
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Bundle nucleo-js y oráculo de calidad (KJ empaqueta el bundle y compara con el oráculo, tareas 1.1 y 1.3)
        run: |
          npm ci --ignore-scripts
          npm run nucleo:construir
      # fixture-sintetico: los escenarios de NAT-03/NAT-04 y CT leen e2e/videos/sinteticos (fuera de git); sin ellos se
      # omitirían en silencio. Mismo generador que en local (ffmpeg en Docker; Chromium para el render MRZ).
      - name: Vídeos sintéticos (npm run e2e:videos)
        run: |
          npx playwright install --with-deps chromium
          npx tsc -b
          npm run e2e:videos
      # Tarea 1.5 (NAT-06): :nucleo empaqueta mrz.traineddata verificado y KJ lee las escenas MRZ sintéticas con
      # Tesseract real (PERSONA_BASE, pasaporte de OD-01 y el conjunto E del eval mrz-imagen).
      - name: Modelo MRZ y escenas MRZ sintéticas (tarea 1.5)
        run: |
          npm run modelos:mrz
          node tools/nativo/fixtures-mrz.mjs
      - name: Imagen del SDK de Android (acepta la Android SDK License; ver docker/android-sdk/Dockerfile)
        run: docker build --build-arg ACEPTO_LICENCIA_ANDROID_SDK=si -t lector-android-sdk docker/android-sdk
      - name: Pruebas JVM (KJ, con Tesseract nativo del host obligatorio), AAR del OCR nativo e informe de dependencias
        run: docker run --rm -v "$PWD:/work" -w /work/native/android lector-android-sdk ./gradlew --no-daemon testDebugUnitTest -PocrObligatorio=true -PocrHilos=4 :lector-cedula:informeDependencias :tesseract4android:assembleRelease
      - name: Diferencial de calidad frente a packages/capture (CT, estricto)
        run: CT_ESTRICTO=1 npx vitest run packages/nucleo-js/test/nat-03-diferencial-calidad.test.ts
      - name: Sin libjpeg ni libpng en el AAR, la biblioteca del host ni el informe (tarea 1.5)
        run: node tools/nativo/sin-jpeg-png.mjs native/android/tesseract4android/build/outputs/aar/tesseract4android-release.aar native/android/nucleo/build/ocr-host/liblectorcedula_ocr.so native/android/lector-cedula/build/dependencias-resueltas.txt
      - name: Paridad de vistas y líneas MRZ con packages/capture (CT, NAT-06)
        run: CT_ESTRICTO=1 npx vitest run packages/nucleo-js/test/nat-06-diferencial-mrz.test.ts
      - name: Licencias nativas (NAT-16)
        run: node tools/licencia-check.mjs --solo-nativo
      - name: Informes de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativo-android-jvm-${{ github.sha }}
          path: |
            native/android/lector-cedula/build/reports/
            native/android/nucleo/build/reports/
            native/android/nucleo/build/volcados/
            native/android/nucleo/build/goldens/
          if-no-files-found: ignore

  # KM de calidad y presencia (tarea 1.3), solo bajo demanda (workflow_dispatch con `pit`). PIT en un solo proceso tardó
  # más de 4 h: aquí se reparte en fragmentos de clases disjuntas que corren en paralelo, sin las pruebas del Lector
  # (tarea 1.2), y pit-resumen suma los mutations.xml con el umbral de design.md (>= 85 %).
  pit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - fragmento: mrz
            clases: io.github.jorgeluissanchez.lectorcedula.mrz.*
            excluir: ""
          - fragmento: presencia
            clases: io.github.jorgeluissanchez.lectorcedula.calidad.Presencia*
            excluir: ""
          - fragmento: calidad
            clases: io.github.jorgeluissanchez.lectorcedula.calidad.Calidad*
            excluir: ""
          - fragmento: resto
            clases: io.github.jorgeluissanchez.lectorcedula.calidad.*
            excluir: io.github.jorgeluissanchez.lectorcedula.calidad.Presencia*,io.github.jorgeluissanchez.lectorcedula.calidad.Calidad*
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Bundle, oráculo y vídeos sintéticos
        run: |
          npm ci --ignore-scripts
          npm run nucleo:construir
          npx playwright install --with-deps chromium
          npx tsc -b
          npm run e2e:videos
          npm run modelos:mrz
      - name: Imagen del SDK de Android
        run: docker build --build-arg ACEPTO_LICENCIA_ANDROID_SDK=si -t lector-android-sdk docker/android-sdk
      - name: PIT (${{ matrix.fragmento }})
        env:
          CLASES: ${{ matrix.clases }}
          EXCLUIR: ${{ matrix.excluir }}
          SIN_PRUEBAS: io.github.jorgeluissanchez.lectorcedula.Lector*,io.github.jorgeluissanchez.lectorcedula.EstadoLector*,io.github.jorgeluissanchez.lectorcedula.motor.*,io.github.jorgeluissanchez.lectorcedula.nucleo.*,io.github.jorgeluissanchez.lectorcedula.calidad.CalidadDiferencialNat03Test,*DiferencialMrzNat06Test,*TesseractNat06Test
        run: |
          EXTRA=()
          if [ -n "$EXCLUIR" ]; then EXTRA+=("-PpitExcluir=$EXCLUIR"); fi
          docker run --rm -v "$PWD:/work" -w /work/native/android lector-android-sdk ./gradlew --no-daemon :nucleo:pitest \
            "-PpitClases=$CLASES" "${EXTRA[@]}" -PpitHilos=3 -PpitUmbral=0 "-PpitSinPruebas=$SIN_PRUEBAS"
      - name: Informe PIT
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-${{ matrix.fragmento }}
          path: native/android/nucleo/build/reports/pitest/
          if-no-files-found: ignore

  pit-resumen:
    needs: pit
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.pit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pit-*
          path: pit
      - name: Puntuación global (KM, umbral 85 %)
        run: node tools/pit-resumen.mjs pit --umbral 85

  # KM de la tarea 1.5 (NAT-06): PIT del plan de vistas, la vista del OCR y el bucle MRZ con sus pruebas unitarias (las
  # diferenciales en QuickJS y las de Tesseract real quedan fuera: minutos por mutante). Umbral de design.md (85 %).
  mutacion-mrz:
    if: ${{ !inputs.pit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Bundle nucleo-js y modelo MRZ verificado
        run: |
          npm ci --ignore-scripts
          npm run nucleo:construir
          npm run modelos:mrz
      - name: Imagen del SDK de Android (acepta la Android SDK License; ver docker/android-sdk/Dockerfile)
        run: docker build --build-arg ACEPTO_LICENCIA_ANDROID_SDK=si -t lector-android-sdk docker/android-sdk
      - name: PIT (KM) de la MRZ nativa
        env:
          CLASES: io.github.jorgeluissanchez.lectorcedula.mrz.PlanMrz*,io.github.jorgeluissanchez.lectorcedula.mrz.VistaOcr*,io.github.jorgeluissanchez.lectorcedula.mrz.LectorMrz*,io.github.jorgeluissanchez.lectorcedula.mrz.EvaluadorBundle*,io.github.jorgeluissanchez.lectorcedula.mrz.DecodificadorMrz*,io.github.jorgeluissanchez.lectorcedula.mrz.ModeloMrz*,io.github.jorgeluissanchez.lectorcedula.mrz.ImagenRgba*
          SIN_PRUEBAS: io.github.jorgeluissanchez.lectorcedula.calidad.*,io.github.jorgeluissanchez.lectorcedula.motor.*,io.github.jorgeluissanchez.lectorcedula.nucleo.*,io.github.jorgeluissanchez.lectorcedula.Lector*,io.github.jorgeluissanchez.lectorcedula.EstadoLector*,*DiferencialMrzNat06Test,*TesseractNat06Test
        run: |
          docker run --rm -v "$PWD:/work" -w /work/native/android lector-android-sdk ./gradlew --no-daemon :nucleo:pitest \
            "-PpitClases=$CLASES" -PpitHilos=4 -PpitUmbral=85 "-PpitSinPruebas=$SIN_PRUEBAS"
      - name: Informe de mutación
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativo-android-pit-mrz-${{ github.sha }}
          path: native/android/nucleo/build/reports/pitest/
          if-no-files-found: ignore

  # Emulador con KVM (no hay KVM anidado en Docker Desktop sobre Windows). Job trivial de la fase 0: arranca el
  # emulador API 34 x86_64 en modo avión y comprueba que responde; las instrumentadas (KI) y el humo (KH) llegan en la fase 1.
  emulador:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # KI de NAT-05 (tarea 1.4): bundle para el núcleo, vídeos sintéticos y fixtures de las instrumentadas (frames RGBA
      # y bytes de decodificarPdf417Imagen de la web sobre el mismo frame) en src/androidTest/assets/sinteticos, ignorado por git.
      - name: Bundle, vídeos sintéticos y fixtures de NAT-05
        run: |
          npm ci --ignore-scripts
          npm run nucleo:construir
          npx playwright install --with-deps chromium
          npx tsc -b
          npm run e2e:videos
          node packages/nucleo-js/scripts/generar-fixtures-pdf417.mjs
          # Tarea 1.5: :nucleo empaqueta mrz.traineddata verificado (NAT-06, mismo modelo que la web).
          npm run modelos:mrz
      - name: APK de las instrumentadas (KI)
        working-directory: native/android
        run: ./gradlew --no-daemon :lector-cedula:assembleDebugAndroidTest
      - name: Emulador API 34 x86_64 sin red e instrumentadas (KI)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back emulated
          working-directory: native/android
          script: |
            adb shell settings put global airplane_mode_on 1
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "34"
            ./gradlew --no-daemon :lector-cedula:connectedDebugAndroidTest
      - name: Informes de las instrumentadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nativo-android-ki-${{ github.sha }}
          path: |
            native/android/lector-cedula/build/reports/androidTests/
            native/android/lector-cedula/build/outputs/androidTest-results/
          if-no-files-found: ignore
