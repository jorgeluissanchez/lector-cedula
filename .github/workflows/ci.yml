name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de pruebas (dependencias, Chromium, modelo MRZ, tsc -b, assets web)
        uses: ./.github/actions/preparar-node
      - name: Puerta completa (tipos, lint, pruebas, licencias, privacidad, evals)
        run: npm run check
      - name: Reporte de evals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-${{ github.sha }}
          path: evals/reports/latest.json
          if-no-files-found: ignore

  # demo-opciones: E2E acotadas a la PWA (build normal en 4173 y demo en 4175, E2E_SERVIDORES=pwa) con 1 worker: el
  # panel de opciones de la demo en Chromium escritorio y Pixel 7, y la regresión de la lectura, la guía, el fraude y
  # la TI del build normal (la sesión de captura cambió). Los vídeos sintéticos se generan con ffmpeg en Docker.
  e2e-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de pruebas (dependencias, Chromium, modelo MRZ, tsc -b, assets web)
        uses: ./.github/actions/preparar-node
      - name: Vídeos sintéticos de la cámara simulada
        run: npm run e2e:videos
      - name: E2E del panel de opciones de la demo
        env:
          E2E_SERVIDORES: pwa
        run: npx playwright test e2e/demo --project=demo-chromium --project=demo-pixel7 --workers=1
      - name: Regresión de la PWA (lectura, guía, fraude y TI)
        if: always()
        env:
          E2E_SERVIDORES: pwa
        run: >-
          npx playwright test e2e/lectura/lectura.spec.ts e2e/lectura/lectura-digital.spec.ts e2e/lectura/riesgo.spec.ts
          e2e/lectura/tarjeta-identidad.spec.ts e2e/captura/guia.spec.ts
          --project=lectura-chromium --project=lectura-pixel7
          --project=captura-desenfocada-1080p-escritorio --project=captura-desenfocada-1080p-pixel --workers=1
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-${{ github.sha }}
          path: |
            reports/playwright
            test-results
          if-no-files-found: ignore

  # La mutación (Stryker) va en .github/workflows/mutacion.yml: matriz por área, en push a main y cada noche.

  # Las pruebas del servidor corren en la misma imagen que en local (`docker compose -f server/compose.yaml run --rm
  # pruebas`): necesitan Node, los parsers compilados, el lector y los montajes /srv/fixtures_sinteticos y
  # /srv/docs/decisiones de compose.yaml. Con uv directo en el runner esas rutas no existen.
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Ruff y pytest en Docker (server/compose.yaml, servicio pruebas)
        run: docker compose -f server/compose.yaml run --rm pruebas
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Licencias Python (lista negra)
        run: node tools/licencia-check.mjs --pip $(sed -n '/^dependencies/,/]/p' server/pyproject.toml | grep -oE '"[a-zA-Z0-9_.-]+' | tr -d '"')

  # La imagen de la demo (Dokploy construye apps/pwa/Dockerfile): falló sin que CI lo viera al añadir un workspace.
  imagen-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de la demo
        run: docker build -f apps/pwa/Dockerfile -t lector-pwa-ci .
      - name: Arranca y sirve la página
        run: |
          docker run -d --name pwa -p 8080:80 lector-pwa-ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "<div id=\"app\"\|<script"
